name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning
          additional_files: 'install.sh greeter/deploy.sh greeter/launch.sh'
        env:
          SHELLCHECK_OPTS: -x

  qmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
      - name: Run qmllint
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(**/*.qml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No QML files found"
            exit 0
          fi
          qmllint "${files[@]}"
